appId: com.237mrt.postiva
productName: Postiva

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'

extraResources:
  - from: build/icon.ico
    to: icon.ico

  - from: build/icon.png
    to: icon.png

  - from: build/tray-icon.png
    to: tray-icon.png

  - from: build/window-icon.png
    to: window-icon.png

win:
  executableName: Postiva
  icon: icon.ico

  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

  artifactName: Postiva-Setup-${version}.${ext}

  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico

  createDesktopShortcut: always
  createStartMenuShortcut: true

  shortcutName: Postiva
  uninstallDisplayName: Postiva

linux:
  target:
    - AppImage

  category: Utility
  maintainer: 237mrt

  icon: icon.png

appImage:
  artifactName: Postiva-${version}.${ext}

npmRebuild: false
